# 실행: docker compose up -d --build  ->  http://localhost:8080
# DB 는 밖으로 포트를 열지 않는다. 화면(web)만 호스트에 노출한다.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      # 기본값은 내부망 전용 DB 라서 둔 것이다. 공개 서버에서는 .env 로 바꾼다
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_local_only}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD:-portfolio_local_only}@db:5432/portfolio
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
